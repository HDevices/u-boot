# Interfaz: Raspberry Pi Pico con DirtyJTAG
source [find interface/dirtyjtag.cfg]

# Bajamos un poco la frecuencia por si acaso aparece "TDO stuck"
adapter speed 1000

# Configuracion del TAP JTAG
set _CHIPNAME a13
set _CPUTAPID 0x4ba00477

# TAP con IR length de 4
jtag newtap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id $_CPUTAPID

# Detectar el Debug Access Port
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# Crear el objetivo Cortex-A8 asociado al DAP
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_a -dap $_CHIPNAME.dap

# Sin pin SRST conectado: usar SYSRESETREQ por software
$_TARGETNAME configure -event reset-assert-pre {
    echo "Forzando reset por software (SYSRESETREQ)..."
}
