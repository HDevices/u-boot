# Allwinner A13 JTAG through a Raspberry Pi Pico running DirtyJTAG.
source [find interface/dirtyjtag.cfg]

# Keep the JTAG clock conservative while validating the connection.
adapter speed 1000

set _CHIPNAME a13
set _CPUTAPID 0x4ba00477

# The A13 TAP uses a 4-bit instruction register.
jtag newtap $_CHIPNAME cpu -irlen 4 -ircapture 0x1 -irmask 0xf \
	-expected-id $_CPUTAPID

# Debug Access Port and Cortex-A8 target.
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME cortex_a -dap $_CHIPNAME.dap

# No SRST is connected; reset through the ARM system request instead.
$_TARGETNAME configure -event reset-assert-pre {
	echo "Forcing reset through SYSRESETREQ..."
}
